<header [ngClass]="headerClasses()" class="fixed left-0 right-0 top-0 z-50 transition-all duration-300">
    <div class="container-custom">
        <nav class="flex h-24 items-center justify-between gap-4">
            <a routerLink="/" class="group flex items-center gap-4">
                <span class="flex h-14 w-14 items-center justify-center rounded-2xl border border-surface-200 bg-white shadow-sm transition-transform duration-300 group-hover:scale-[1.03]">
                    <img src="logo-nuevo-compact.png" alt="DevMenteStudio" width="320" height="208" class="w-10 h-auto object-contain" />
                </span>
                <span class="hidden sm:block">
                    <span class="block text-[0.68rem] uppercase tracking-[0.28em] text-surface-500">{{ copy().studioLabel }}</span>
                    <span class="block font-display text-xl font-semibold text-surface-900">DevMenteStudio</span>
                </span>
            </a>

            <div class="hidden lg:flex items-center gap-2 rounded-full border border-surface-200 bg-white/50 p-2 backdrop-blur-xl">
                @for (item of navItems(); track item.href) {
                <a [routerLink]="item.href" routerLinkActive="text-primary-700 bg-white shadow-sm"
                    [routerLinkActiveOptions]="{ exact: item.href === '/' }"
                    class="rounded-full px-4 py-2 text-sm font-medium text-surface-600 transition-all hover:bg-white hover:text-surface-900">
                    {{ item.label }}
                </a>
                }
            </div>

            <div class="hidden lg:flex items-center gap-3">
                <div class="flex items-center rounded-full border border-surface-200 bg-surface-50 p-1">
                    <button type="button" class="rounded-full px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] transition-colors"
                        [ngClass]="language() === 'es' ? 'bg-white shadow-sm text-surface-900' : 'text-surface-500 hover:text-surface-900'"
                        (click)="setLanguage('es')">
                        ES
                    </button>
                    <button type="button" class="rounded-full px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] transition-colors"
                        [ngClass]="language() === 'en' ? 'bg-white shadow-sm text-surface-900' : 'text-surface-500 hover:text-surface-900'"
                        (click)="setLanguage('en')">
                        EN
                    </button>
                </div>
                <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer"
                    class="inline-flex min-h-11 items-center gap-2 rounded-full border border-[#00965f]/40 bg-[#00965f]/10 px-4 py-2 text-sm font-semibold text-[#007a4d] transition-colors hover:bg-[#00965f] hover:text-white"
                    [attr.aria-label]="language() === 'es' ? 'Hablar por WhatsApp con Oscar' : 'Chat on WhatsApp with Oscar'">
                    <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26A9.9 9.9 0 0 1 12.05 2c2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 7 9.9 9.9 0 0 1-9.88 9.89M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.9 0-3.18-1.23-6.16-3.48-8.41"/>
                    </svg>
                    <span>WhatsApp</span>
                </a>
                <a routerLink="/contacto" class="btn-primary px-6">
                    {{ copy().cta }}
                </a>
            </div>

            <button type="button" class="lg:hidden rounded-full border border-surface-200 bg-white p-3 text-surface-600 transition-colors hover:text-surface-900"
                (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen()"
                [attr.aria-label]="language() === 'es' ? 'Abrir menú' : 'Open menu'">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    @if (mobileMenuOpen()) {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    } @else {
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    }
                </svg>
            </button>
        </nav>
    </div>

    @if (mobileMenuOpen()) {
    <div class="absolute left-0 right-0 top-full border-t border-surface-200 bg-white/95 backdrop-blur-2xl lg:hidden">
        <div class="container-custom py-6">
            <div class="surface-panel flex flex-col gap-4 p-5">
                <div class="flex items-center justify-between rounded-2xl border border-surface-200 bg-surface-50 px-4 py-3">
                    <span class="text-xs font-semibold uppercase tracking-[0.2em] text-surface-500">{{ copy().languageLabel }}</span>
                    <div class="flex items-center rounded-full border border-surface-200 bg-surface-100/50 p-1">
                        <button type="button" class="rounded-full px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] transition-colors"
                            [ngClass]="language() === 'es' ? 'bg-white shadow-sm text-surface-900' : 'text-surface-500 hover:text-surface-900'"
                            (click)="setLanguage('es')">
                            ES
                        </button>
                        <button type="button" class="rounded-full px-3 py-2 text-xs font-semibold uppercase tracking-[0.18em] transition-colors"
                            [ngClass]="language() === 'en' ? 'bg-white shadow-sm text-surface-900' : 'text-surface-500 hover:text-surface-900'"
                            (click)="setLanguage('en')">
                            EN
                        </button>
                    </div>
                </div>

                @for (item of navItems(); track item.href) {
                <a [routerLink]="item.href" routerLinkActive="text-primary-700 font-semibold"
                    [routerLinkActiveOptions]="{ exact: item.href === '/' }"
                    class="rounded-2xl px-4 py-3 text-surface-600 transition-colors hover:bg-surface-50 hover:text-surface-900"
                    (click)="closeMobileMenu()">
                    {{ item.label }}
                </a>
                }
                <div class="border-t border-surface-200 pt-4">
                    <a routerLink="/contacto" class="btn-primary w-full text-center" (click)="closeMobileMenu()">
                        {{ copy().cta }}
                    </a>
                </div>
            </div>
        </div>
    </div>
    }
</header>

<div class="h-24"></div>
